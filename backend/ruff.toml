# Ruff configuration for the Birthright backend.
#
# Notes for future code reviewers:
#  - Tests are allowed cosmetic deviations (long lines, multi-statement lines, etc.).
#    They're scratch surfaces for hypothesis-driven debugging.
#  - Test fixture strings flagged by some external scanners as "hardcoded secrets"
#    (e.g. tests/test_iter5_chat_ws.py) are intentional mocks. They never reach
#    Stripe, Resend, or any real third party.
#  - We DO NOT change `is None` / `is not None` to `== None`. PEP 8 explicitly
#    REQUIRES `is`/`is not` for singleton comparisons. External scanners that
#    flag this are misconfigured.

target-version = "py311"
line-length = 120

[lint]
# Pyflakes (real bugs: undefined names, unused vars) + pycodestyle errors.
# Deliberately exclude `I` (isort) — the codebase does not follow strict
# isort ordering and historical imports are intentional groupings.
select = ["E", "F", "W"]
ignore = [
    "E501",  # line-too-long — line-length above already raises the bar
    "E402",  # module-level import not at top — conditional imports after env load are intentional
    "W291", "W292", "W293",  # trailing-whitespace cosmetics
]

[lint.per-file-ignores]
# Tests: full latitude
#   E701/E702: multiple-statements-on-one-line
#   F401:     unused imports (fixtures often appear unused)
#   F841:     unused local variables (kept for readability in ARRANGE blocks)
"tests/**" = ["E701", "E702", "F401", "F841"]
